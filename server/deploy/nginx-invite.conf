# invite.xjj-love-byy.cloud：请帖静态站 + 同源后端（/api、/admin → 127.0.0.1:3100）
# 服务器上位于 /etc/nginx/conf.d/xinvitation.conf；证书由 certbot 自动续期（certbot-renew.timer）
# 修改后：nginx -t && systemctl reload nginx

# 按 IP 限速（在 Node 内的限流之外再挡一层），10 次/秒，突发 20
limit_req_zone $binary_remote_addr zone=inv_api:10m rate=10r/s;

server {
    server_name invite.xjj-love-byy.cloud;

    root /var/www/xinvitation;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff font/woff2 application/font-woff;

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /fonts/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # 分享缩略图（静态导出的文件无扩展名，显式声明为 PNG）
    location = /opengraph-image {
        default_type image/png;
        expires 1d;
    }

    # 请帖后端接口
    location /api/ {
        limit_req zone=inv_api burst=20 nodelay;
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        # 覆盖而不是追加：防止客户端伪造 X-Forwarded-For 冒充 IP
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
    }

    # 后台网页（数据仍需令牌）
    location = /admin {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    error_page 404 /404.html;

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/invite.xjj-love-byy.cloud/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/invite.xjj-love-byy.cloud/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = invite.xjj-love-byy.cloud) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80 default_server;
    listen [::]:80 default_server;
    server_name invite.xjj-love-byy.cloud;
    return 404; # managed by Certbot
}
